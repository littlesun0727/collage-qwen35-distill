name: CPU validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: bash -n scripts/setup.sh scripts/serve.sh
      - run: python -m pytest tests -q
      - run: python -m eval.score --gt eval/examples/gt.jsonl --pred eval/examples/predictions.jsonl --occlusions eval/examples/occlusions.jsonl --out runs/eval-example
